jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run lab.py
        run: |
          python ./lab.py  # Це шлях до вашого файлу lab.py

          on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Your Name'
        required: true
        default: 'Executer'

on:
  schedule:
    - cron: '0 9 * * *'  # Щодня о 9 ранку
